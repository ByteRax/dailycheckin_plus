# Refs: T-A07 task 4.
# Fork note: the PyPI project `dailycheckin` is owned by upstream Sitoi, so this
# fork cannot publish it. This workflow no longer uploads to PyPI; it builds the
# sdist + wheel and attaches them to the GitHub Release instead. Install from
# source with:
#   pip install "dailycheckin @ git+https://github.com/ByteRax/dailycheckin_plus@<tag>"
# Versioning is unchanged (dailycheckin/__version__.py via setup.py).

name: Build and Attach Release Assets

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - name: Install pypa/build
        run: python -m pip install build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Upload dist to the GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
