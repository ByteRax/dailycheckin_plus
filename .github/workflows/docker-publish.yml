name: Docker Push

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Refs: T-A07 task 4. Context is the repo root so the source tree is
          # available for the source-install Dockerfile (was '{{defaultContext}}:docker').
          context: ./
          file: docker/Dockerfile
          # arm/v6 dropped (no python:3.11-slim variant), arm/v7 dropped
          # (pycryptodome 3.17 has no armv7 wheel; would need a toolchain).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/byterax/dailycheckin_plus:latest
